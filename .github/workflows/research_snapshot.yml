name: Weekly Research Snapshot Worker

on:
  schedule:
    - cron: "0 2 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-research-worker
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      API_BASE_URL: https://webbsite-ccass-api.onrender.com

    steps:
      - name: Verify API token secret
        run: test -n "${{ secrets.CCASS_API_TOKEN }}"

      - name: Wait for Render health
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 45 "$API_BASE_URL/health"; then
              echo
              exit 0
            fi
            sleep 30
          done
          exit 1

      - name: Queue weekly research worker
        run: |
          curl --fail --silent --show-error --max-time 60 -X POST \
            -H "Authorization: Bearer ${{ secrets.CCASS_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"groups":["research"],"sleep_seconds":1.5}' \
            "$API_BASE_URL/admin/run_daily" > daily_job.json
          python - <<'PY'
          import json
          data = json.load(open("daily_job.json", encoding="utf-8"))
          print(f"Queued {data['job_id']}; created={data.get('created')}; groups={data.get('groups')}")
          open("job_id", "w", encoding="utf-8").write(data["job_id"])
          PY

      - name: Wait for worker and publish summary
        run: |
          job_id="$(cat job_id)"
          for attempt in $(seq 1 540); do
            curl --fail --silent --show-error --max-time 60 \
              -H "Authorization: Bearer ${{ secrets.CCASS_API_TOKEN }}" \
              "$API_BASE_URL/admin/jobs/$job_id" > job.json
            python - <<'PY'
          import json
          data=json.load(open("job.json", encoding="utf-8"))
          job=data.get("job", {})
          detail=job.get("detail", {}) or {}
          print(json.dumps({"status": job.get("status"), "total": detail.get("total", 0), "succeeded": detail.get("succeeded", 0), "skipped": detail.get("skipped", 0), "failed": detail.get("failed", 0), "current_code": detail.get("current_code", ""), "elapsed_s": detail.get("elapsed_s", 0)}, ensure_ascii=False))
          open("job_status", "w", encoding="utf-8").write(str(job.get("status", "")))
          PY
            status="$(cat job_status)"
            if [ "$status" = "succeeded" ] || [ "$status" = "failed" ] || [ "$status" = "cancelled" ]; then break; fi
            sleep 20
          done
          python - <<'PY'
          import json, os
          data=json.load(open("job.json", encoding="utf-8"))
          job=data.get("job", {})
          detail=job.get("detail", {}) or {}
          summary=(
              "### Weekly research worker\n"
              f"- groups: {', '.join(detail.get('groups', []))}\n"
              f"- succeeded: {detail.get('succeeded', 0)}\n"
              f"- skipped: {detail.get('skipped', 0)}\n"
              f"- failed: {detail.get('failed', 0)}\n"
              f"- elapsed_s: {detail.get('elapsed_s', 0)}\n"
          )
          with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"), "a", encoding="utf-8") as handle:
              handle.write(summary)
          if job.get("status") != "succeeded" or detail.get("failed", 0):
              raise SystemExit("weekly research worker failed")
          PY
